# ハーネスなしのベースライン（Δ の基準）。install が空 = 空の設定ディレクトリで起動する。
id: claude-baseline
agent: claude_code
model: sonnet
# API キーを環境変数 ANTHROPIC_API_KEY に設定している場合（その端末で実行する。値はここに書かない）:
# inherit_env: [ANTHROPIC_API_KEY]
# 組織のゲートウェイ経由で使う場合（値はここに書かず、実際に使う認証変数と合わせて名前だけ並べる。
# API キーや CLAUDE_CODE_OAUTH_TOKEN と併用する形でも同様）:
# inherit_env: [ANTHROPIC_AUTH_TOKEN, ANTHROPIC_BASE_URL, ANTHROPIC_DEFAULT_OPUS_MODEL, ANTHROPIC_DEFAULT_SONNET_MODEL, ANTHROPIC_DEFAULT_HAIKU_MODEL]
# （ANTHROPIC_DEFAULT_*_MODEL を並べないと、ハーネス内の opus サブエージェント等が別名を解決できず失敗し、ハーネス側だけが不当に不利になる）
# （billing は既定の api: 呼び出しごとに課金。--max-cost-usd と月の予算が効く）
# Bedrock を使う場合（利用先の値に置き換える）:
# env:
#   CLAUDE_CODE_USE_BEDROCK: "1"
#   AWS_REGION: ap-northeast-1
#   ANTHROPIC_MODEL: <推論プロファイル ARN>   # model より優先したい場合は model を消す
# サブスクリプション（Pro / Max）で評価する場合: 端末で `claude setup-token` → `export CLAUDE_CODE_OAUTH_TOKEN=<トークン>` してから実行
# （macOS のキーチェーンのログインは試行では使えない）。値はここに書かない:
# inherit_env: [CLAUDE_CODE_OAUTH_TOKEN]
# billing: subscription
