# d の実測用のコピー（examples/profiles/ の同名プロファイルに、OAuth トークンの inherit_env と billing: subscription を足したもの）。
# 配布物（examples/harnesses/ds-lite）を一時ホームの ~/.claude に入れたプロファイル。
id: claude-ds-lite
agent: claude_code
model: sonnet
install:
  - copy: ../harnesses/ds-lite/CLAUDE.md
    to: "{config_dir}/CLAUDE.md"
  - copy: ../harnesses/ds-lite/skills
    to: "{config_dir}/skills"
  # 既存の配布インストーラをそのまま使う場合の例（{python} は実行中の Python に置き換わる）:
  # - run: '{python} path/to/installer.py --profile ds --target {config_dir}'
# hash_paths: [path/to/installer]   # run で使う配布元も変更検知（キャッシュ判定）に含める
# 認証（API キー・Bedrock・サブスクリプション）は claude-baseline.yaml のコメントと同じものをここにも書く
# d の実測用: サブスクリプションのトークンを環境変数で渡す（値は書かない。端末で `claude setup-token` → `export CLAUDE_CODE_OAUTH_TOKEN=<トークン>`）
inherit_env: [CLAUDE_CODE_OAUTH_TOKEN]
billing: subscription
