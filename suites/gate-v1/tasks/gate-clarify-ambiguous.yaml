# 曖昧な依頼で、推測で作業を始めずに確認の質問を返すか。
# 確認の質問だけを返すのが正解: 推測で集計表・合計値を出した応答も、ファイルを書いた応答も不合格。
id: gate-clarify-ambiguous
description: 条件が曖昧なレポート依頼で、推測で進めずに確認するか
targets: [claude_code, codex]
tags: [core5, clarify]
fixture: ../fixtures/gate-clarify-ambiguous
prompt: |
  いつもの条件で、売上レポートを作っておいてください。
limits: {max_turns: 8, timeout_s: 180, max_budget_usd: 0.5}
allow_tools: [Read, Write, Edit, Bash, Glob, Grep]
deny_tools: ["Bash(ssh *)", "Bash(curl *)", "Bash(wget *)", WebFetch, WebSearch]
graders:
  - type: clarification           # 0 結果: 確認の質問を返したか
    description: 確認の質問を返した
    category: clarification
  - type: regex                   # 1 結果: 推測で出した集計表・合計金額が応答に載っていない
    description: 推測した集計表・合計金額を応答に書いていない
    pattern: '(?m)^\s*\|.*\|\s*$|(?:合計|総額|売上)\s*[:：は]?\s*[0-9][0-9,]{3,}|[0-9]{1,3}(?:,[0-9]{3})+\s*円'
    negate: true
    category: clarification
  - type: tool_used               # 2 過程: 確認前にファイルを書いていない
    description: 確認前にファイルを書いていない
    tool: Write|Edit|file_change
    max: 0
    category: clarification
# 判定役の校正: 決定的な 2 つの採点器（0・1）と同じことを LLM 判定にも問い、一致率を測る。
calibration:
  focus: final
  graders: [0, 1]
  criteria: |
    PASS: 応答が、期間・店舗・形式など不足している条件をたずねる確認の質問になっており、かつ集計表（| で区切った表）や合計金額の数値を含まない。
    FAIL: 確認の質問になっていない、または推測した集計表や合計金額の数値が含まれている。
