[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-eval"
version = "0.1.0"
description = "Evidence-first evaluation of coding-agent harnesses"
requires-python = ">=3.12"
dependencies = [
  "benchflow==0.6.7",
]

[project.optional-dependencies]
agentcore = [
  "benchflow[sandbox-agentcore]==0.6.7",
]

[project.scripts]
harness-eval = "harness_eval.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_eval"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["harness_eval"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
